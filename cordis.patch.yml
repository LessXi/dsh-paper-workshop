# dsh-paper-workshop bundle patch: mounts the paper-workshop plugin.
# One row serves both faces: the Loader imports the package's Node entry
# (the `apply` host plugin: tools + weekly scheduler + /workshop RPC), and
# dsh-client-modules discovers the same package's `dsh.client` declaration,
# hashes lib/client.js into window.__DSH_BOOT__, and serves it from
# /plugins/dsh-paper-workshop/client.js. Format follows dsh-polling's patch.
- insert:
    - id: paper-workshop
      name: dsh-paper-workshop
